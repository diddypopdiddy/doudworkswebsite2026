<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Studio Room Layer Preview</title>
  <style>
    :root { color-scheme: dark; font-family: Inter, ui-sans-serif, system-ui, sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; background: #111; color: #f7f3ed; display: grid; grid-template-columns: minmax(220px, 300px) 1fr; }
    aside { padding: 24px; background: #191919; border-right: 1px solid #343434; overflow: auto; }
    h1 { font-size: 19px; line-height: 1.15; margin: 0 0 8px; }
    p { color: #aaa; font-size: 13px; line-height: 1.45; margin: 0 0 18px; }
    .actions { display: flex; gap: 8px; margin-bottom: 18px; }
    button { border: 1px solid #4a4a4a; background: #282828; color: inherit; border-radius: 8px; padding: 7px 10px; cursor: pointer; }
    button:hover { background: #333; }
    label { display: grid; grid-template-columns: 18px 1fr auto; gap: 8px; align-items: center; min-height: 34px; font-size: 13px; cursor: pointer; }
    label small { color: #777; }
    main { min-width: 0; display: grid; place-items: center; padding: 28px; overflow: auto; }
    #stage { position: relative; width: min(100%, calc((100vh - 56px) * 1.5)); aspect-ratio: 3 / 2; background-color: #242424; background-image: linear-gradient(45deg,#303030 25%,transparent 25%),linear-gradient(-45deg,#303030 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#303030 75%),linear-gradient(-45deg,transparent 75%,#303030 75%); background-size: 24px 24px; background-position: 0 0,0 12px,12px -12px,-12px 0; box-shadow: 0 18px 60px #000a; }
    #stage img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; pointer-events: none; }
    @media (max-width: 760px) { body { grid-template-columns: 1fr; grid-template-rows: auto 1fr; } aside { max-height: 42vh; border-right: 0; border-bottom: 1px solid #343434; } main { padding: 14px; } }
  </style>
</head>
<body>
  <aside>
    <h1>Studio room layers</h1>
    <p>Every image shares one 1536×1024 coordinate system. Toggle layers or solo one to inspect its extraction.</p>
    <div class="actions"><button id="all">Show all</button><button id="none">Hide all</button></div>
    <div id="controls"></div>
  </aside>
  <main><div id="stage" aria-label="Layered studio room preview"></div></main>
  <script>
    const stage = document.querySelector('#stage');
    const controls = document.querySelector('#controls');
    fetch('./manifest.json').then(response => response.json()).then(manifest => {
      manifest.layers.forEach((layer, index) => {
        const image = Object.assign(document.createElement('img'), { src: layer.file, alt: '', hidden: !layer.defaultVisible });
        image.dataset.layer = layer.file;
        image.style.zIndex = index;
        stage.append(image);
        const label = document.createElement('label');
        const check = Object.assign(document.createElement('input'), { type: 'checkbox', checked: layer.defaultVisible });
        check.addEventListener('change', () => image.hidden = !check.checked);
        const name = document.createElement('span'); name.textContent = layer.label;
        const solo = document.createElement('button'); solo.type = 'button'; solo.textContent = 'solo'; solo.title = `Show only ${layer.label}`;
        solo.addEventListener('click', event => { event.preventDefault(); [...controls.querySelectorAll('input')].forEach((input, i) => { input.checked = i === index; input.dispatchEvent(new Event('change')); }); });
        label.append(check, name, solo); controls.append(label);
      });
      const setAll = visible => [...controls.querySelectorAll('input')].forEach(input => { input.checked = visible; input.dispatchEvent(new Event('change')); });
      document.querySelector('#all').onclick = () => setAll(true);
      document.querySelector('#none').onclick = () => setAll(false);
    });
  </script>
</body>
</html>
