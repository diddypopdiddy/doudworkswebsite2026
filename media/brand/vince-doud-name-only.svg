<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="220" viewBox="0 0 900 220">

  <style>
    @font-face {
      font-family: "Inter";
      src: url("./InterVariable.ttf") format("truetype");
      font-weight: 100 900;
      font-style: normal;
    }
    .inter { font-family: "Inter", Arial, sans-serif; }
    .editorial { font-family: "Charter", Georgia, serif; }
    .label { font-size: 14px; font-weight: 650; letter-spacing: 1.5px; }
    .section-number { font-size: 17px; font-weight: 750; fill: #B86533; letter-spacing: 1px; }
    .section-title { font-size: 17px; font-weight: 750; fill: #171B1F; letter-spacing: 1.2px; }
    .body { font-size: 18px; font-weight: 430; fill: #171B1F; }
    .small { font-size: 13px; font-weight: 450; fill: #646B70; }
    .micro { font-size: 11px; font-weight: 650; fill: #646B70; letter-spacing: .8px; }
  </style>
  <rect width="900" height="220" fill="#FFFFFF"/>
  <text x="60" y="156" class="inter" fill="#171B1F" font-size="150"
    font-weight="700" letter-spacing="-1.8">Vince Doud</text>
</svg>
