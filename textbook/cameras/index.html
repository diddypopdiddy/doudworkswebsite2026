<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Camera simulators · Video Production</title>
<link rel="stylesheet" href="../shared/textbook.css">
<link rel="stylesheet" href="../shared/camera-sim.css">
</head>
<body>
<div id="app"></div>
<script defer src="../hosted-bootstrap.js"></script>
<script type="text/textbook-script" src="../config.js"></script>
<script type="text/textbook-script" src="../toc.js"></script>
<script type="text/textbook-script" src="../shared/glossary.js"></script>
<script type="text/textbook-script" src="../shared/media.js"></script>
<script type="text/textbook-script" src="../shared/camera-bodies.js"></script>
<script type="text/textbook-script" src="../shared/textbook.js"></script>
<script type="text/textbook-script">
  const cameraIds = ['g97', 'fz300', 'elph180', 'hcx1600', 'phone'];
  function linkedCamera() {
    const id = location.hash.slice(1);
    return cameraIds.includes(id) ? id : 'g97';
  }
  Textbook.preloadCamera(linkedCamera());
</script>
<script type="text/textbook-script" src="../shared/camera-engine.js"></script>
<script type="text/textbook-script" src="../shared/camera-sim.js"></script>
<script type="text/textbook-script">
  const page = Textbook.shell();
  page.classList.add('camera-lab-page');
  page.append(Textbook.el('header', { className: 'topic-header' },
    Textbook.el('a', { className: 'eyebrow', href: '../index.html', text: 'Video Production textbook' }),
    Textbook.el('h1', { text: 'Camera simulators' }),
    Textbook.el('p', { className: 'big-idea', text: 'Choose a camera and start recording. Select Call action to cue the reader in the library, then stop and play back your take.' })));
  const practice = Textbook.renderBlock({
    type: 'camera-sim', title: 'Open practice',
    body: cameraIds, initialBody: linkedCamera(), level: 3, scene: 'note-library',
    kit: ['battery', 'card', 'cloth', 'mic-wireless', 'mic-shotgun', 'headphones', 'slate', 'white-card'],
    start: { power: true, mode: 'video', settings: { exposureMode: 'M' } }, callAction: true,
    forBody: {
      fz300: { kit: ['battery', 'card', 'cloth', 'mic-wireless', 'mic-shotgun', 'slate', 'white-card'] },
      elph180: { level: 1, start: { power: true }, kit: ['battery', 'card', 'cloth', 'slate'] },
      hcx1600: { start: { power: true, mode: 'MANU' } },
      phone: { level: 2, start: { power: true, settings: { sideways: true } }, kit: ['cloth', 'slate'] }
    }
  }).node;
  page.append(practice);
  practice.addEventListener('click', event => {
    const choice = event.target.closest('button[data-cam-body]');
    if (choice && location.hash !== '#' + choice.dataset.camBody) {
      history.replaceState(null, '', '#' + choice.dataset.camBody);
    }
  });
  window.addEventListener('hashchange', () => {
    const id = linkedCamera();
    const choice = practice.querySelector('button[data-cam-body="' + id + '"]');
    if (choice?.getAttribute('aria-pressed') === 'false') choice.click();
  });
  const lessons = ['camera-readiness', 'record-and-verify-a-take', 'focus', 'depth-of-field',
    'frame-rate-and-shutter-speed', 'exposure', 'white-balance-and-color-temperature',
    'gain-levels-and-headphone-monitoring', 'check-picture-and-sound', 'record-coverage-and-takes',
    'camera-judgment', 'build-a-frame-for-a-purpose'];
  page.append(Textbook.el('nav', { className: 'camera-lesson-links', 'aria-label': 'Guided camera lessons' },
    Textbook.el('h2', { text: 'Guided camera lessons' }),
    Textbook.el('ul', {}, lessons.map(slug => {
      const topic = Textbook.findTopic(slug).topic;
      return Textbook.el('li', {}, Textbook.el('a', { href: Textbook.topicURL(topic) + '#camera-practice',
        text: topic.id + ' ' + topic.title }));
    }))));
</script>
</body>
</html>
